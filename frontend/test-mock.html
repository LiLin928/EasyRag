<!DOCTYPE html>
<html>
<head>
    <title>Mock 测试</title>
</head>
<body>
    <h1>Mock 数据测试</h1>
    <pre id="result"></pre>

    <script type="module">
        // 测试 Mock 数据
        const result = document.getElementById('result');

        async function test() {
            try {
                // 测试工具 API
                const toolsRes = await fetch('/api/v2/tools');
                const toolsData = await toolsRes.json();
                result.textContent += '工具数据:\n' + JSON.stringify(toolsData, null, 2) + '\n\n';

                // 测试技能 API
                const skillsRes = await fetch('/api/v2/skills');
                const skillsData = await skillsRes.json();
                result.textContent += '技能数据:\n' + JSON.stringify(skillsData, null, 2) + '\n\n';

                // 测试 MCP API
                const mcpsRes = await fetch('/api/v2/mcps');
                const mcpsData = await mcpsRes.json();
                result.textContent += 'MCP 数据:\n' + JSON.stringify(mcpsData, null, 2) + '\n\n';
            } catch (error) {
                result.textContent += '错误: ' + error.message + '\n';
            }
        }

        test();
    </script>
</body>
</html>
