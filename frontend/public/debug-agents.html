<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能体挂载诊断</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            border-bottom: 2px solid #409eff;
            padding-bottom: 10px;
        }
        h2 {
            color: #666;
            margin-top: 30px;
        }
        .section {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            margin: 15px 0;
        }
        .success {
            color: #67c23a;
            font-weight: bold;
        }
        .error {
            color: #f56c6c;
            font-weight: bold;
        }
        .warning {
            color: #e6a23c;
            font-weight: bold;
        }
        .data-list {
            list-style: none;
            padding: 0;
        }
        .data-list li {
            padding: 8px;
            background: white;
            margin: 5px 0;
            border-left: 3px solid #409eff;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
        button {
            background: #409eff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        button:hover {
            background: #66b1ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 智能体挂载诊断工具</h1>

        <h2>1. 环境检查</h2>
        <div class="section" id="env-check">
            正在检查环境...
        </div>

        <h2>2. Mock 模式检查</h2>
        <div class="section" id="mock-check">
            正在检查 Mock 配置...
        </div>

        <h2>3. 数据加载测试</h2>
        <div class="section">
            <button onclick="testDataLoad()">点击测试数据加载</button>
            <div id="data-result" style="margin-top: 15px;"></div>
        </div>

        <h2>4. Store 状态检查</h2>
        <div class="section" id="store-check">
            点击上方按钮后显示
        </div>

        <h2>5. 解决方案建议</h2>
        <div class="section" id="solutions">
            <p>请先运行上述测试，根据测试结果查看建议。</p>
        </div>
    </div>

    <script>
        // 页面加载时自动运行环境检查
        window.onload = async function() {
            await checkEnvironment();
        };

        async function checkEnvironment() {
            const envDiv = document.getElementById('env-check');
            try {
                // 检查是否在正确的域
                const currentDomain = window.location.origin;
                envDiv.innerHTML = `
                    <p><strong>当前域：</strong>${currentDomain}</p>
                    <p><strong>API 基础路径：</strong>/api/v2</p>
                    <p class="success">✓ 环境检查通过</p>
                `;
            } catch (error) {
                envDiv.innerHTML = `<p class="error">✗ 环境检查失败: ${error.message}</p>`;
            }
        }

        async function testDataLoad() {
            const resultDiv = document.getElementById('data-result');
            const storeDiv = document.getElementById('store-check');
            const solutionsDiv = document.getElementById('solutions');

            resultDiv.innerHTML = '<p>正在加载数据...</p>';

            try {
                // 测试工具 API
                const toolsRes = await fetch('/api/v2/tools');
                const toolsData = await toolsRes.json();

                // 测试技能 API
                const skillsRes = await fetch('/api/v2/skills');
                const skillsData = await skillsRes.json();

                // 测试 MCP API
                const mcpsRes = await fetch('/api/v2/mcps');
                const mcpsData = await mcpsRes.json();

                // 显示结果
                resultDiv.innerHTML = `
                    <p class="success">✓ 数据加载成功！</p>
                `;

                // 显示 Store 状态
                storeDiv.innerHTML = `
                    <h3>工具 (${toolsData.data?.length || 0} 个)</h3>
                    <ul class="data-list">
                        ${(toolsData.data || []).map(t => `<li>${t.name}</li>`).join('')}
                    </ul>

                    <h3>技能 (${skillsData.data?.length || 0} 个)</h3>
                    <ul class="data-list">
                        ${(skillsData.data || []).map(s => `<li>${s.ico} ${s.name}</li>`).join('')}
                    </ul>

                    <h3>MCP (${mcpsData.data?.length || 0} 个)</h3>
                    <ul class="data-list">
                        ${(mcpsData.data || []).map(m => `<li>${m.name} (${m.tp})</li>`).join('')}
                    </ul>
                `;

                // 提供解决方案
                const hasData = (toolsData.data?.length > 0) ||
                               (skillsData.data?.length > 0) ||
                               (mcpsData.data?.length > 0);

                if (hasData) {
                    solutionsDiv.innerHTML = `
                        <p class="success">✓ 数据加载正常！</p>
                        <p><strong>问题可能在前端组件：</strong></p>
                        <ol>
                            <li>检查浏览器控制台是否有 JavaScript 错误</li>
                            <li>刷新页面，清除缓存（Ctrl+Shift+R）</li>
                            <li>检查 Network 面板，确认请求是否成功</li>
                            <li>如果还是不行，请提供控制台截图</li>
                        </ol>
                    `;
                } else {
                    solutionsDiv.innerHTML = `
                        <p class="warning">⚠ 数据为空！</p>
                        <p><strong>可能原因：</strong></p>
                        <ol>
                            <li>Mock 模式未启用（检查 .env.development）</li>
                            <li>后端数据库没有数据</li>
                            <li>API 请求被拦截或认证失败</li>
                        </ol>
                        <p><strong>解决方案：</strong></p>
                        <ol>
                            <li>确认 VITE_USE_MOCK=true 在 .env.development 中</li>
                            <li>重启前端服务：pnpm dev</li>
                            <li>检查后端是否运行（如果使用真实 API）</li>
                        </ol>
                    `;
                }

            } catch (error) {
                resultDiv.innerHTML = `<p class="error">✗ 数据加载失败: ${error.message}</p>`;

                storeDiv.innerHTML = `<p class="error">无法获取 Store 状态</p>`;

                solutionsDiv.innerHTML = `
                    <p class="error">✗ 数据加载失败！</p>
                    <p><strong>可能原因：</strong></p>
                    <ol>
                        <li>前端服务未运行或崩溃</li>
                        <li>API 路径配置错误</li>
                        <li>Mock 模式配置问题</li>
                        <li>网络连接问题</li>
                    </ol>
                    <p><strong>解决方案：</strong></p>
                    <ol>
                        <li>检查前端服务是否在运行（访问 http://localhost:3000）</li>
                        <li>检查 .env.development 配置</li>
                        <li>重启前端服务：pnpm dev</li>
                        <li>查看浏览器控制台的详细错误信息</li>
                    </ol>
                `;
            }
        }
    </script>
</body>
</html>
