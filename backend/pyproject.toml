[project]
name = "easyrag-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "bcrypt>=4.0.1,<4.1",
  "structlog>=24.1",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-openai>=0.2",
  "langchain-ollama>=0.2",
  "langgraph>=0.2",
  "langchain-mcp-adapters>=0.1",
  "openai>=1.30",
  "langsmith>=0.1",
  "langfuse>=3.0",
  "cryptography>=42",
  "httpx>=0.27",
  # Plan 3: 知识库 + 文档解析
  "pgvector>=0.3",
  "arq>=0.26",
  "redis>=5.0",
  "pymupdf>=1.24",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  "aiofiles>=23.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
