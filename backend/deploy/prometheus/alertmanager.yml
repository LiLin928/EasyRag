global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
  - match:
      severity: critical
    receiver: 'critical'
  - match:
      severity: warning
    receiver: 'warning'

receivers:
- name: 'default'
  webhook_configs:
  - url: 'http://localhost:5001/webhook'

- name: 'critical'
  webhook_configs:
  - url: 'http://localhost:5001/webhook/critical'

- name: 'warning'
  webhook_configs:
  - url: 'http://localhost:5001/webhook/warning'