<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>API 测试工具</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; margin: 10px 0; cursor: pointer; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>OpenWeatherMap API 测试</h1>
    
    <div class="test-section">
        <h2>测试1: 完整URL (无参数)</h2>
        <button onclick="test1()">运行测试</button>
        <pre id="result1">点击按钮测试...</pre>
    </div>
    
    <div class="test-section">
        <h2>测试2: 模板参数</h2>
        <button onclick="test2()">运行测试</button>
        <pre id="result2">点击按钮测试...</pre>
    </div>
    
    <script>
        async function test1() {
            const resultDiv = document.getElementById('result1');
            resultDiv.innerHTML = '测试中...';
            
            const url = 'https://api.openweathermap.org/data/2.5/weather?q=BeiJing&appid=1564bd59e86f981289a646fb2c421a63&units=metric';
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `<span class="success">✅ 成功!</span>\n\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultDiv.innerHTML = `<span class="error">❌ 失败: HTTP ${response.status}</span>\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ 错误: ${error.message}</span>`;
            }
        }
        
        async function test2() {
            const resultDiv = document.getElementById('result2');
            resultDiv.innerHTML = '测试中...';
            
            const template = 'https://api.openweathermap.org/data/2.5/weather?q={q}&appid={appid}&units={units}';
            const args = {
                q: 'BeiJing',
                appid: '1564bd59e86f981289a646fb2c421a63',
                units: 'metric'
            };
            
            // 参数替换
            let url = template;
            for (const [key, value] of Object.entries(args)) {
                url = url.replace(`{${key}}`, value);
            }
            
            resultDiv.innerHTML = `URL替换结果:\n${url}\n\n发送请求...`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `URL替换结果:\n${url}\n\n<span class="success">✅ 成功!</span>\n\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultDiv.innerHTML = `URL替换结果:\n${url}\n\n<span class="error">❌ 失败: HTTP ${response.status}</span>\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ 错误: ${error.message}</span>`;
            }
        }
    </script>
</body>
</html>
